
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Tech Stock Pick</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f4f8;
    color: #222;
    margin: 0;
    padding: 30px;
}

.container {
    width: 96%;
    max-width: 1250px;
    margin: 20px auto;
    padding: 30px;
    background: #fff;
    border: 1px solid #d4e2ef;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h2 {
    color: #0874b9;
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    margin-bottom: 45px;
}

caption {
    font-size: 25px;
    font-weight: bold;
    padding: 20px;
    color: #222;
}

th, td {
    border: 1px solid #777;
    padding: 18px;
    text-align: left;
    vertical-align: middle;
    font-size: 16px;
    overflow-wrap: anywhere;
}

th {
    background: #0874b9;
    color: white;
}

th:nth-child(1) { width: 17%; }
th:nth-child(2) { width: 13%; }
th:nth-child(3) { width: 25%; }
th:nth-child(4) { width: 45%; }

.stock-image {
    display: block;
    width: 170px;
    height: 125px;
    max-width: 100%;
    margin: auto;
    object-fit: contain;
}

fieldset {
    width: 750px;
    max-width: 100%;
    margin: 25px auto;
    padding: 25px;
    border: 2px solid #b9d8f1;
    border-radius: 5px;
}

legend {
    text-align: center;
    color: #0874b9;
    font-weight: bold;
    font-size: 18px;
    padding: 0 12px;
}

.form-row {
    display: grid;
    grid-template-columns: 210px 1fr;
    gap: 20px;
    align-items: center;
    margin: 15px 0;
}

.form-row > label {
    font-size: 15px;
}

input, select {
    width: 100%;
    padding: 12px;
    border: 1px solid #a9c6df;
    border-radius: 4px;
    font-size: 15px;
    background: white;
}

.gender {
    display: flex;
    align-items: center;
    gap: 12px;
}

.gender input {
    width: auto;
}

.gender label {
    width: auto;
}

.buttons {
    text-align: center;
    margin: 30px;
}

button {
    background: #0874b9;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 12px 30px;
    margin: 5px;
    font-size: 15px;
}

footer {
    background: #0874b9;
    color: white;
    text-align: center;
    padding: 18px;
    margin-top: 35px;
}

/* Laptop and desktop layout */
@media (min-width: 1000px) {
    .container {
        min-width: 850px;
    }
}

/* Smaller screens */
@media (max-width: 700px) {
    body {
        padding: 8px;
    }

    .container {
        width: 100%;
        padding: 10px;
        margin: 0;
    }

    th, td {
        padding: 6px;
        font-size: 11px;
    }

    .stock-image {
        height: 75px;
    }

    fieldset {
        padding: 12px;
    }

    .form-row {
        grid-template-columns: 1fr;
        gap: 7px;
    }

    input, select {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<!-- STOCK TABLE -->

<table>

<caption>My Tech Stock Pick</caption>

<thead>
<tr>
    <th>Name</th>
    <th>Symbol</th>
    <th>Images</th>
    <th>Contact</th>
</tr>
</thead>

<tbody>

<tr>
    <td>Microsofti</td>
    <td>MSFT</td>

    <td>
        <svg class="stock-image"
        viewBox="0 0 160 120"
        xmlns="http://www.w3.org/2000/svg">

            <rect x="20" y="15" width="52" height="40"
            fill="#f25022"/>

            <rect x="78" y="15" width="52" height="40"
            fill="#7fba00"/>

            <rect x="20" y="61" width="52" height="40"
            fill="#00a4ef"/>

            <rect x="78" y="61" width="52" height="40"
            fill="#ffb900"/>

        </svg>
    </td>

    <td>
        • Email: microsofti@mc.se
        <br><br>
        • ©2013 Microsoft Corporation

        <ol type="i">
            <li>Email: microsofti@mc.se</li>
            <li>©2026 Microsoft Corporation</li>
        </ol>
    </td>
</tr>

<tr>
    <td>Cisco Systems</td>
    <td>CSCO</td>

    <td>
        <svg class="stock-image"
        viewBox="0 0 180 130"
        xmlns="http://www.w3.org/2000/svg">

            <rect x="15" y="35" width="150"
            height="65" rx="8" fill="#303b45"/>

            <rect x="23" y="43" width="134"
            height="48" rx="4" fill="#566675"/>

            <g fill="#72c9ee">
                <rect x="32" y="53" width="13" height="22"/>
                <rect x="51" y="53" width="13" height="22"/>
                <rect x="70" y="53" width="13" height="22"/>
                <rect x="89" y="53" width="13" height="22"/>
                <rect x="108" y="53" width="13" height="22"/>
                <rect x="127" y="53" width="13" height="22"/>
            </g>

            <circle cx="150" cy="108" r="4"
            fill="#00c853"/>

            <text x="90" y="24"
            font-size="13"
            text-anchor="middle"
            fill="#0874b9"
            font-weight="bold">
                CISCO SWITCH
            </text>

        </svg>

        Switch
        <br>
        www.uk.hardware.info
    </td>

    <td>
        Cisco Systems
    </td>
</tr>

</tbody>
</table>


<!-- PERSONAL INFORMATION -->

<form>

<fieldset>

<legend>Personal Information</legend>

<div class="form-row">
    <label>Surname</label>
    <input type="text" value="Kiplagat">
</div>

<div class="form-row">
    <label>First Name</label>
    <input type="text" value="Dennis">
</div>

<div class="form-row">
    <label>Other Names</label>
    <input type="text" value="Kipkemei">
</div>

<div class="form-row">
    <label>Gender</label>

    <div class="gender">
        <input type="radio" name="gender" checked>
        <label>Male</label>

        <input type="radio" name="gender">
        <label>Female</label>
    </div>
</div>

<div class="form-row">
    <label>Marital Status</label>

    <select>
        <option selected>Single</option>
        <option>Married</option>
        <option>Divorced</option>
    </select>
</div>

<div class="form-row">
    <label>Date of Birth</label>
    <input type="date" value="2000-01-01">
</div>

<div class="form-row">
    <label>Place of Birth</label>
    <input type="text" value="Sample Town">
</div>

<div class="form-row">
    <label>Mothers Name</label>
    <input type="text" value="Sample Mother">
</div>

<div class="form-row">
    <label>Fathers Name</label>
    <input type="text" value="Sample Father">
</div>

<div class="form-row">
    <label>Number of Dependants</label>

    <select>
        <option>0</option>
        <option>1</option>
        <option>2</option>
        <option selected>3</option>
        <option>4</option>
        <option>5 or more</option>
    </select>
</div>

<div class="form-row">
    <label>Level of Education</label>

    <select>
        <option>Primary</option>
        <option>Secondary</option>
        <option selected>University</option>
        <option>College</option>
    </select>
</div>

</fieldset>


<!-- SECURITY INFORMATION -->

<fieldset>

<legend>Security Information</legend>

<div class="form-row">
    <label>UserName</label>
    <input type="text" value="demo_user">
</div>

<div class="form-row">
    <label>Password</label>
    <input type="password" value="Demo1234">
</div>

<div class="form-row">
    <label>Re-type Password</label>
    <input type="password" value="Demo1234">
</div>

<div class="form-row">
    <label>Security Question</label>

    <select>
        <option selected>What is your favourite colour?</option>
        <option>What is your birthplace?</option>
        <option>What is your favourite food?</option>
    </select>
</div>

<div class="form-row">
    <label>Answer</label>
    <input type="text" value="Blue">
</div>

</fieldset>

<div class="buttons">
    <button type="button">Previous</button>
    <button type="button">Next</button>
</div>

</form>

<footer>
    ©BIT 202
</footer>

</div>

</body>
</html>
